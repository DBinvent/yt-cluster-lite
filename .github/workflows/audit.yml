name: "audit&geiger"   # the badge's label, as Schema Guard's

# cargo audit: known vulnerabilities (RustSec) in the dependencies. cargo geiger: unsafe
# code in the crates here and in each crate they use, on the run's summary page.
# On a push and a pull request (Dependabot's among them), and weekly: an advisory can come
# out with nothing changed here.
#
# diff_doc comes from crates.io (1.1 on, its `proto` feature): the run checks out this
# repository alone, under yt-cluster-lite/.
on:
  push:
    branches-ignore: ["dependabot/**"]   # their pull request runs it
  pull_request:
  schedule:
    - cron: "27 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        # bash -eo pipefail: GitHub's default shell has no pipefail, and a piped step
        # (cargo geiger | tee) would hide the command's failure
        shell: bash
        working-directory: yt-cluster-lite
    steps:
      - uses: actions/checkout@v7
        with:
          path: yt-cluster-lite
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # the committed Cargo.lock: first that it is still the manifests' - a build would
      # refuse one that is not - then its crates
      - run: cargo metadata --locked --format-version 1 > /dev/null
      - run: cargo audit
      # and what a build resolving today would get, as a warning: an advisory with a fix
      # released that the lock has not taken yet - cargo update takes it
      - name: cargo audit, freshly resolved (warning only)
        continue-on-error: true
        run: |
          cargo generate-lockfile
          cargo audit

  geiger:
    runs-on: ubuntu-latest
    defaults:
      run:
        # bash -eo pipefail: GitHub's default shell has no pipefail, and a piped step
        # (cargo geiger | tee) would hide the command's failure
        shell: bash
        working-directory: yt-cluster-lite
    steps:
      - uses: actions/checkout@v7
        with:
          path: yt-cluster-lite
      - uses: dtolnay/rust-toolchain@stable
      # the crates build: protoc for the protos, the OpenSSL headers for yt-lite's TLS
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger
      # a report, not a gate: the counts go to the log and the summary page. Each member of the
      # workspace alone - geiger takes no virtual manifest (`--workspace` here was refused,
      # 2026-11-14) and wants an absolute path - and its exit 1 for files of crates it did not
      # scan (their docs, examples) is no failure; a member with no report is one
      # [audit 2026-11-20] yt-core with every feature: its yt-lite-mysql binary needs `mysql`, and a
      # target whose features are off stops geiger before any report
      - run: |
          for p in yt-core-proto yt-core yt-turso-load; do
            feat=""; [ "$p" = yt-core ] && feat="--all-features"
            out="$(cargo geiger --manifest-path "$PWD/$p/Cargo.toml" $feat --output-format GitHubMarkdown 2> geiger.err)" || true
            printf '## %s\n\n%s\n' "$p" "$out" | tee -a "$GITHUB_STEP_SUMMARY"
            grep -q " $p " <<< "$out" || { tail -20 geiger.err; echo "no geiger report for $p"; exit 1; }
          done
